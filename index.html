<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- REDIRECT CONFIGURATION -->
    <!-- 1. Meta Tag Redirect (Fallback): Change the url=... to your destination -->
    <meta http-equiv="refresh" content="2;url=https://munkijeong.notion.site/Munki-Jeong-s-Personal-Website-2bd0a26082e780c88a84de6cd1573e5d?source=copy_link">
</head>
<body class="flex items-center justify-center min-h-screen bg-white">
    <div class="text-center">
        <h1 class="text-3xl font-bold text-gray-900">Redirecting to XYZ</h1>
        <p class="mt-4 text-gray-600">
            If you are not redirected automatically, 
            <a href="https://munkijeong.notion.site/Munki-Jeong-s-Personal-Website-2bd0a26082e780c88a84de6cd1573e5d?source=copy_link" id="manual-link" class="text-blue-600 hover:underline font-medium">click here</a>.
        </p>
    </div>

    <script>
        // 2. JavaScript Redirect (Primary): Change the URL below
        const targetURL = "https://munkijeong.notion.site/Munki-Jeong-s-Personal-Website-2bd0a26082e780c88a84de6cd1573e5d?source=copy_link";

        // Logic to handle the redirect
        document.getElementById('manual-link').href = targetURL;
        
        setTimeout(() => {
            window.location.href = targetURL;
        }, 2000); // 2000ms = 2 seconds delay
    </script>
</body>
</html>
